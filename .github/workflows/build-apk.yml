name: Build Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk WikiSearch.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WikiSearch-Android-APK
          path: WikiSearch.apk

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "WikiSearch Native Android APK v1.0.${{ github.run_number }} (Material 3 White Theme & 8-Step Inspector)"
          body: |
            ## 🏆 Wikipedia Local Search Engine (HCL Hackathon)
            
            100% Native Android APK built with Material 3, sleek white theme, smooth animations, and dual-tab 8-Step Engine Inspector.
            
            ### 🌐 Live Web Demo & Inspector:
            - **Web & Engine Inspector**: [https://wikipedia-search-engine-55an.onrender.com/](https://wikipedia-search-engine-55an.onrender.com/)
            
            ### 📱 Download Latest Native APK:
            - **Direct Download**: [Download WikiSearch.apk](https://github.com/mdansaridw/wikipedia-search-engine/releases/latest/download/WikiSearch.apk)
            
            ### 🚀 What's New in This Release:
            - **100% Native Android Client**: Replaced WebView with native Android components (`RecyclerView`, `CardView`, `BottomSheetDialogFragment`).
            - **Modern Sleek White Theme**: Crisp light mode with Material 3 styling, color-coded step badges, and rich dark mode support.
            - **8-Step Deep-Tech Engine Inspector**: Live native cards showing DocStore seek, Tokenizer, Dict offsets, VByte 69% decompression, BM25 math breakdown, Two-Pointer phrase scan, Min-Heap selection, and Dynamic Snippets.
            - **Built-in Full Article Reader**: Clean reading canvas with estimated reading time and direct Wikipedia link.
            - **Cloud & Local Wi-Fi Switcher**: Pre-configured to auto-connect to Render cloud deployment with instant Wi-Fi fallback in Settings.
          make_latest: true
          draft: false
          prerelease: false
          files: WikiSearch.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
