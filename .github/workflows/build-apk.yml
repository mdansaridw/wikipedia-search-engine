name: Build Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk WikiSearch.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WikiSearch-Android-APK
          path: WikiSearch.apk

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "WikiSearch Android APK v1.0.1 (Cloud & Local Enabled)"
          body: |
            ## 🏆 Wikipedia Local Search Engine (HCL Hackathon)
            
            Installable Android APK connecting to both Cloud-Hosted and Local Wi-Fi BM25 & exact-phrase search engine.
            
            ### 📱 Download & Run:
            1. Download **`WikiSearch.apk`** below directly onto your Android device or emulator.
            2. By default, it connects to the cloud backend on Render.
            3. Tap the **Settings** gear icon anytime to switch to your laptop's local Wi-Fi IP (e.g. `http://<laptop-ip>:8000`).
          draft: false
          prerelease: false
          files: WikiSearch.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
